name: Benin Watch V1.1
on:
  schedule:
    # 2 fois/heure, horaire non garanti. On garde ce rythme pour les tests.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Envoyer un test ntfy uniquement ?'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: benin-watch-v1
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      
      - name: Install dependencies
        run: python -m pip install -r requirements.txt


      - name: Run unit tests
        run: python -m unittest -v test_watcher.py
      - name: Check site or test ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: |
          if [ "$TEST_NOTIFICATION" = "true" ]; then
            python -u watcher.py --test
          else
            python -u watcher.py
          fi
      - name: Persist state even when check fails
        # !cancelled() permits persistence even if a previous step failed.
        if: ${{ !cancelled() && inputs.test_notification != true }}
        run: |
          if [ ! -f watcher_state.json ]; then
            echo 'No state file found; nothing to persist.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add watcher_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update monitoring state [skip ci]'
            git push
          fi

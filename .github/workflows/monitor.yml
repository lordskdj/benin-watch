name: Benin Watch V2 (full watcher)
# Full Python watcher (classification, queue, reminders, daily report). It is the SECONDARY path:
# fast detection comes from the independent Cloudflare canary (canary/, every ~1 min).
# GitHub schedules are best effort (delays/skips happen): never rely on this alone.
# Every 30 min while the repository is private (free minutes); ~10 min once it is public.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Envoyer un test ntfy uniquement ?'
        type: boolean
        default: false
permissions:
  contents: read  # state is kept in the Actions cache, never pushed to Git
concurrency:
  group: benin-watch-v1  # unchanged name: never overlaps with a run started by the V1 workflow
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04  # pinned image: system python3 3.12 + system tz database, no pip
    timeout-minutes: 5
    env:
      BW_INSTANCE: GH
      # No BW_REMINDER_MINUTES: default reminders (5,15,30,60 min) are sent from here, the only
      # full watcher. They are delivered at the next run, so their timing follows the schedule.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      # On a cache miss, the committed watcher_state.json (checked out above) is the starting point.
      - name: Restore monitoring state
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            watcher_state.json
            watcher_state.json.bak
            self_alert.json
          key: benin-watch-state-${{ github.run_id }}
          restore-keys: benin-watch-state-
      - name: Check site or test ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL_GH }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: |
          if [ "$TEST_NOTIFICATION" = "true" ]; then
            python3 -B watcher.py --test
          else
            python3 -B watcher.py
          fi
      - name: Save monitoring state
        if: ${{ !cancelled() && inputs.test_notification != true }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            watcher_state.json
            watcher_state.json.bak
            self_alert.json
          key: benin-watch-state-${{ github.run_id }}
